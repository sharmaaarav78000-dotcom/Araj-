    <script>
      // Suppress benign [vite] websocket connection error in sandboxed cloud preview environment
      (function() {
        const _origConsoleError = console.error;
        const _origConsoleWarn = console.warn;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            return;
          }
          return _origConsoleError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            return;
          }
          return _origConsoleWarn.apply(console, args);
        };
      })();
    </script>
